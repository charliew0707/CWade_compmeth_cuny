[project]
name = "cwade-compmeth-cuny"
version = "0.1.0"
description = "Computational Methods — CUNY (Charlie Wade)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "astropy",
    "pandas",
    "pyscf",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
